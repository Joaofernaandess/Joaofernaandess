<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="850" height="250">
  <style>
    /* Fundo principal */
    .bg { fill: #0d1117; }
    
    /* Estilo das letras caindo (Verde estilo terminal) */
    .matrix-text {
      font-family: monospace;
      font-size: 24px;
      fill: #239120;
      opacity: 0;
      animation: fall linear infinite;
    }

    /* Título (Seu Nome) */
    .title {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-weight: 800;
      font-size: 65px;
      fill: #ffffff;
    }
    
    /* Subtítulo */
    .subtitle {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-weight: 600;
      font-size: 25px;
      fill: #61DAFB; 
    }

    /* Animação Keyframe para a queda */
    @keyframes fall {
      0% { transform: translateY(-50px); opacity: 0; }
      10% { opacity: 0.5; }
      50% { opacity: 0.1; }
      100% { transform: translateY(300px); opacity: 0; }
    }

    /* Delays e durações variadas para simular aleatoriedade */
    .c1 { animation-duration: 3s; animation-delay: 0s; }
    .c2 { animation-duration: 4s; animation-delay: 1.5s; }
    .c3 { animation-duration: 2.5s; animation-delay: 0.5s; }
    .c4 { animation-duration: 3.5s; animation-delay: 2s; }
    .c5 { animation-duration: 4.5s; animation-delay: 1s; }
    .c6 { animation-duration: 3.2s; animation-delay: 0.8s; }
    .c7 { animation-duration: 2.8s; animation-delay: 1.2s; }
  </style>

  <!-- Retângulo de fundo -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Palavras flutuantes no fundo -->
  <text x="50" y="0" class="matrix-text c1">React</text>
  <text x="150" y="0" class="matrix-text c2">SELECT *</text>
  <text x="250" y="0" class="matrix-text c3">.NET 8</text>
  <text x="350" y="0" class="matrix-text c4">C#</text>
  <text x="450" y="0" class="matrix-text c5">Java</text>
  <text x="550" y="0" class="matrix-text c6">Clean Code</text>
  <text x="650" y="0" class="matrix-text c7">POST</text>
  <text x="750" y="0" class="matrix-text c1"><div/></text>

  <!-- Seu nome e cargo centralizados -->
  <text x="425" y="125" text-anchor="middle" class="title">João Fernandes</text>
  <text x="425" y="170" text-anchor="middle" class="subtitle">Software Developer</text>
</svg>