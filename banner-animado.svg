<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="850" height="250">
  <!-- Fundo -->
  <rect width="100%" height="100%" fill="#0d1117" />
  
  <style>
    /* Mantemos apenas a animação no CSS */
    .matrix { animation: fall linear infinite; }
    @keyframes fall {
      0% { transform: translateY(-50px); opacity: 0; }
      10% { opacity: 0.8; }
      50% { opacity: 0.2; }
      100% { transform: translateY(300px); opacity: 0; }
    }
    .d1 { animation-duration: 3s; animation-delay: 0s; }
    .d2 { animation-duration: 4s; animation-delay: 1.5s; }
    .d3 { animation-duration: 2.5s; animation-delay: 0.5s; }
    .d4 { animation-duration: 3.5s; animation-delay: 2s; }
    .d5 { animation-duration: 4.5s; animation-delay: 1s; }
    .d6 { animation-duration: 3.2s; animation-delay: 0.8s; }
    .d7 { animation-duration: 2.8s; animation-delay: 1.2s; }
  </style>

  <!-- Letras caindo (Agrupadas com atributos inline de fonte e cor) -->
  <g font-family="monospace" font-size="24px" fill="#239120">
    <text x="50" y="0" class="matrix d1">React</text>
    <text x="150" y="0" class="matrix d2">SELECT *</text>
    <text x="250" y="0" class="matrix d3">.NET 8</text>
    <text x="350" y="0" class="matrix d4">C#</text>
    <text x="450" y="0" class="matrix d5">Java</text>
    <text x="550" y="0" class="matrix d6">Clean Code</text>
    <text x="650" y="0" class="matrix d7">POST</text>
    <text x="750" y="0" class="matrix d1"><div/></text>
  </g>

  <!-- Textos Principais Estáticos (Cores blindadas contra bloqueio de CSS) -->
  <text x="425" y="125" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" font-weight="800" font-size="65px" fill="#ffffff">João Fernandes</text>
  <text x="425" y="170" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" font-weight="600" font-size="25px" fill="#61DAFB">Software Developer</text>
</svg>